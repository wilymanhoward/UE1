[ShadowQuality@3]
; Keep virtual shadows at their standard directional resolution on Epic.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.0

[AntiAliasingQuality@3]
; Reduce the cost of TSR's history buffer while retaining the same output resolution.
r.TSR.History.ScreenPercentage=150
